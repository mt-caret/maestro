name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
          tool-cache: false

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: git+https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org
          dune-cache: true

      - name: Install dependencies
        run: |
          opam install . --locked --deps-only --with-test
          opam install ocamlformat.0.26.2+ox2

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest

      - name: Check formatting
        run: opam exec -- dune fmt && git diff --exit-code
